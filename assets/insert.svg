<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="420" height="160" role="img" aria-labelledby="t d" shape-rendering="crispEdges">
<title id="t">Insert the cartridge</title>
<desc id="d">A cartridge drops into a slot, a light turns on and a 30 XP badge appears.</desc>
<style>
  .cart { animation: insert .9s cubic-bezier(.16,1,.3,1) .25s both; }
  .led { fill: #dbff00; animation: light .4s ease-out 1.05s both; }
  .xp { opacity: 1; animation: fade .4s ease-out 1.15s both; }
  @keyframes insert { from { transform: translateY(-34px); } to { transform: translateY(0); } }
  @keyframes light { from { fill: #2a2a2a; } to { fill: #dbff00; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .cart, .led, .xp { animation: none; }
  }
</style>
<rect width="420" height="160" fill="#0b0b0b"/>
<text x="16" y="24" fill="#a8a8b8" font-family="monospace" font-size="12" letter-spacing="2">INSERT CARTRIDGE</text>
<rect x="130" y="92" width="160" height="14" fill="#2a2a2a" stroke="#4a4a4a" stroke-width="4"/>
<g class="cart">
  <rect x="170" y="48" width="80" height="44" fill="#262626" stroke="#4a4a4a" stroke-width="5"/>
  <rect x="182" y="58" width="56" height="10" fill="#dbff00"/>
  <rect x="182" y="92" width="12" height="8" fill="#fea514"/>
  <rect x="204" y="92" width="12" height="8" fill="#fea514"/>
  <rect x="226" y="92" width="12" height="8" fill="#fea514"/>
</g>
<circle class="led" cx="210" cy="126" r="5"/>
<g class="xp">
  <text x="210" y="150" text-anchor="middle" fill="#dbff00" font-family="monospace" font-size="14" letter-spacing="1">+30 XP</text>
</g>
</svg>
